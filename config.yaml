# Stage 1 configuration. The project and sources blocks are copied byte-for-byte from
# `## Appendix A` of specs/logging-employment-spec.md, extracted with sed rather than retyped;
# `storage:` is Appendix A's four keys plus the originated `constraints_uri` (see StorageConfig).
# Cited by heading, not by line: the pins here read 2022-2049 until 2026-09-10, by which point the
# spec had grown and Appendix A had moved to :2173 — so they pointed into §20's rollout table.
# Appendix A's other source entries (tpo, fia, ces, susb, bds, nonemployer, bea) are
# omitted here, but as of R-S5P-6 they are no longer REJECTED: `SourcesConfig` declares all
# seven as optional `InactiveSourceConfig` fields, so Appendix A's own `sources:` block now
# loads. They stay out of this file because declaring `enabled: false` on a source with no
# ingest module adds nothing a reader can act on -- and because every one of the seven is
# `exclude=True`, writing them in here would not move `run_id` either way. Appendix A's
# `model:` block is present since plan 16 (`ModelConfig`), with its eleven keys verbatim plus
# three this package originated. Adding it re-identifies every run directory once, so plan 16
# re-runs Stage 4's comparand under the new id. Its `validation:` and `promotion:` blocks are
# NOT omitted — both are present below and pin every key (a 2026-09-10 correction; this comment
# claimed all three were absent, which was already untrue when Stage 4 added them). The
# constraints/reconciliation/disclosure blocks are present; `reconciliation:` additionally
# carries five numerical keys Appendix A does not specify (see ReconciliationConfig).
project:
  name: 'logging-state-employment'
  industry_code_supplied: '1113310'
  industry_code_used: '113310'
  industry_title: 'Logging'
  ownership: 'private'
  geography_universe: 'states_dc'
  start_month: '2017-01'
  end_month: '2024-12'
  analysis_mode: 'retrospective_final'
  size_concept: 'march_reference'

storage:
  raw_uri: 'data/raw'
  staged_uri: 'data/staged'
  output_uri: 'runs'
  immutable_raw: true
  # Originated here, not by Appendix A, whose storage block has four keys. The value is
  # §6.2's `data/constraints/` (see StorageConfig).
  constraints_uri: 'data/constraints'

sources:
  qcew:
    enabled: true
    release_status: 'final'
  qcew_size:
    enabled: true
  cbp:
    enabled: true
    api_key_env: 'CENSUS_API_KEY'
    fail_on_unknown_disclosure_regime: true
constraints:
  enforce_integrality: true
  use_milp_when_lp_interval_width_below: 25
  solver: 'highs'
  feasibility_tolerance: 1.0e-7
  rank_tolerance: 1.0e-10

reconciliation:
  single_margin_method: 'bounded_proportional_scaling'
  general_method: 'kl_projection'
  integerize_release: true
  # Originated by plan 4, not by Appendix A, which has no tolerance key.
  tolerance: 1.0e-9
  max_bisection_iterations: 200
  max_projection_iterations: 1000
  zero_seed_floor: 1.0e-12
  integerization_tiebreak: 'largest_remainder'

baselines:
  allow_declared_composite: true
  composite_fallback: 'establishment_proportional'
  historical_lookback_months: 24
  historical_may_cross_naics_vintage: false
  regression_ridge_penalty: 1.0

disclosure:
  exact_reconstruction_action: 'withhold'
  narrow_interval_action: 'manual_review'
  publish_label_required: true
  # Resolves §21's "Disclosure thresholds" row: policy, not evidence. See plan 3.
  narrow_interval_absolute_width: 10
  narrow_interval_relative_width: 0.25

validation:
  pseudo_suppression_seeds: [1024, 2048, 4096]
  include_random_mask_sanity_check: true
  include_primary_like: true
  include_complementary_like: true
  include_long_runs: true
  include_rolling_origin: true
  # Appendix A ships these two true. Both are turned off here with a recorded reason:
  # retrospective smoothing has no smoothing estimator in the §10 registry to exercise, and
  # vintage comparison has no second vintage on disk (see the plan's evidence §6).
  include_retrospective_smoothing: false
  include_vintage_comparison: false
  replicates_per_regime: 20
  minimum_unmasked_lookback_months: 6
  minimum_missing_set_size: 2
  # DECLARED, not detected. A per-cell break detector inside a validation stage is a research
  # project, and the national series does not separate COVID from seasonality cleanly enough.
  # The second window overlaps naics_transition; a month is scored under ONE label, not both.
  structural_break_windows:
    - ["2020-03", "2020-06"]   # COVID; the 2020-04 national move is -5.4%
    - ["2021-10", "2022-03"]   # the NAICS boundary window
  # The seam is derived, not source-published: vintage_for_year returns "NAICS 2022" at year >= 2022.
  naics_seam_month: '2022-01'
  naics_seam_halfwidth_months: 3

model:
  # Appendix A's eleven keys, verbatim.
  backend: 'numpyro'
  chains: 4
  warmup: 1000
  draws: 1000
  target_accept: 0.9
  state_dynamic: 'student_t_ar1'
  include_change_points: false
  include_harvest_factor: false
  include_ces: false
  standardized_beta_sd: 0.5
  suppressed_variance_multipliers: [1.0, 1.5, 2.0]
  # Originated by plan 16, not by Appendix A (see ModelConfig).
  seed: 3645  # sum(map(ord, "logging-employment/state-total-model"))
  priors:
    intercept_mean: 1.5
    intercept_sd: 1.0
    state_scale_sd: 0.5
    region_scale_sd: 0.5
    month_scale_sd: 0.25
    year_scale_sd: 0.25
    persistence_concentration1: 8.0
    persistence_concentration0: 2.0
    persistence_max: 0.95
    innovation_scale_sd: 0.1
    innovation_dispersion_sd: 0.5
    innovation_df: 5.0
  diagnostics:
    max_rhat: 1.01
    min_ess_per_chain: 100
    max_divergences: 0
    min_ppc_coverage_90: 0.85

promotion:
  minimum_wape_improvement: 0.05
  maximum_major_stratum_wape_degradation: 0.02
  nominal_coverage_tolerance: 0.05
  # Originated by plan 16: §13.10's "does not fail catastrophically" states no threshold.
  catastrophic_stratum_coverage_alpha: 0.001
