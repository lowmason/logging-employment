# The repo's documented gates (CLAUDE.md, "Commands") on every push to main and every pull request.
#
# THIS IS THE HERMETIC TIER, NOT THE WHOLE SUITE. `data/` is gitignored and rebuilt only by
# `logging-estimates fetch` (network; CENSUS_API_KEY for CBP) and `build-harmonized`, so no runner
# has it. Every test guarded by `tests/conftest.py::requires_staged`, or by its own skip on a
# gitignored path or a personal file outside the repo (D-055), skips here by design. A green run
# is therefore no evidence about the D1 integration tests: run those where data/ lives.
#
# `-m "not slow and not network"` states the policy the markers declare. Measured at plan 16's
# Task 14 without data/ on the author's Mac: the bare run gives 1681 passed, 72 skipped; this one
# 1661 passed, 45 skipped, 47 deselected. A runner reports one more skip: one audit test skips
# without a personal file outside the repo (D-055). Of the 47 deselected, 27 are data-bound and
# would skip here anyway. The other 20 are plan 16's slow state-total model tests, which need no
# data/ and WOULD run: the expression keeps their minutes of NUTS sampling out of this tier on
# purpose, and they run locally with `pytest -m slow`. No test carries `network`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit. Checked 2026-09-13: astral-sh/setup-uv publishes no floating major tag
      # (tags run v10.1.0, v10.0.1, v10.0.0), so `@v10` would not resolve; both actions are pinned
      # the same way rather than mixing a tag with a commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      # --locked fails when uv.lock no longer matches pyproject.toml instead of re-resolving it.
      - id: sync
        name: uv sync --locked
        run: uv sync --locked

      # Each gate runs whenever the environment built, so one push reports every failing gate
      # rather than only the first. Scopes match CLAUDE.md: `src tests`, never `.`.
      - name: ruff format --check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check src tests
      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check src tests
      - name: interrogate
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run interrogate src
      # Nothing is deselected. The two float goldens that run 34763305304 failed here compare through
      # tests/golden_compare.py: exact on every non-float column, rel 1e-12 / abs 1e-9 on Float64,
      # because OpenBLAS, glibc's libm and polars' per-thread chunking all move the last ulps. Do not
      # pin POLARS_MAX_THREADS to make a golden pass: it hides the thread dependence, not the platform's.
      - name: pytest (hermetic tier)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest -m "not slow and not network"
