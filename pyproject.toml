[project]
name = "logging-employment"
version = "0.1.0"
description = "Monthly state Logging (NAICS 113310) employment by establishment size class"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Lowell Mason", email = "mason.lowell@mac.com" }]
dependencies = [
    "arviz-base>=1.3.1",
    "arviz-stats[xarray]>=1.3.3",
    "h5netcdf[h5py]>=1.8.1",
    "highspy>=1.15.1",
    "httpx>=0.28",
    "jax>=0.11.2",
    "numpy>=2.5",
    "numpyro>=0.22.0",
    "polars>=1.44",
    "pyarrow>=25.0",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "typer>=0.27",
]

[project.scripts]
logging-estimates = "logging_employment.cli:app"

[dependency-groups]
dev = [
    "interrogate>=1.7",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logging_employment"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# FORMAT `src tests`, NEVER `.`. The PEP 723 scripts under scripts/audit/ declare
# `requires-python = ">=3.12"` while this project declares ">=3.14", and ruff takes its target
# from the project. Measured 2026-09-09: `ruff format scripts` rewrites
# `except (ValueError, KeyError):` into PEP 758's `except ValueError, KeyError:` in TWO of them --
# forest_sources.py and qcew_routes.py -- which then fail to parse under the 3.12 their own headers
# promise. (Four scripts/audit files reformat in total; the other two are string-joining changes
# and harmless.) Setting `target-version = "py312"` HERE would fix the formatter and silently
# retarget every pyupgrade rule for src/, so the scope is the guard instead. A nested ruff.toml
# under scripts/audit/ would also work -- ruff resolves the nearest ancestor config per file -- and
# is the better fix if these scripts ever need formatting rather than exclusion.
# This note inherits the reason from the [tool.black] block deleted 2026-09-09; black was dropped
# because it and `ruff format` disagreed on eight files and nothing said which one the tree
# followed.

# `typer.Option(...)` / `typer.Argument(...)` in a parameter default is Typer's API, not the
# mutable-default bug B008 exists to catch. Every CLI command in this package uses that form.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode, not pytest's default prepend: with no `__init__.py` under `tests/`,
# prepend mode keys test modules by bare basename, so `tests/unit/test_qcew_routes.py` and
# `tests/audit/test_qcew_routes.py` collide with "import file mismatch" on a full-suite run.
# The unit suite tests the package; the audit suite tests the Stage 0 scripts. Both earn the
# same name, and importlib gives each its own module identity.
addopts = "--import-mode=importlib"
markers = [
    "network: hits a live source endpoint; excluded from the default run",
    "slow: takes more than a few seconds",
]

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
